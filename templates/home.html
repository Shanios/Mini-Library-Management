<!DOCTYPE html>
<html>
<head>
    <title>Library System</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 15px 25px;
            margin: 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Select Login Role</h2>

    <a href="/admin/"><button>Admin Login</button></a>
    <a href="/user/"><button>User Login</button></a>
</div>

</body>
</html>
