<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 380px;
            margin: auto;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .back {
            margin-top: 20px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>User Login</h2>

    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="loginUser()">Login</button>

    <p id="message"></p>

    <a href="/" class="back">← Back to Role Selection</a>
</div>

<script>
function loginUser() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    fetch("/login/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.access) {
            document.getElementById("message").innerHTML =
                "<span class='success'>Login Successful ✔</span>";

            // Store token locally (important for future API calls)
            localStorage.setItem("access_token", data.access);
            localStorage.setItem("refresh_token", data.refresh);
            window.location.href = "/dashboard/";
        } else {
            document.getElementById("message").innerHTML =
                "<span class='error'>Invalid User</span>";
        }
    })
    .catch(error => {
        document.getElementById("message").innerHTML =
            "<span class='error'>Login Failed</span>";
    });
}
</script>

</body>
</html>
